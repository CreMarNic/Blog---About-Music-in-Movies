# Server Configuration
server.port=${PORT:8080}
spring.application.name=blog-api

# Database Configuration
# Local development uses H2. Deployment can override these with environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:blogdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (for viewing database in browser)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-use-a-strong-random-string-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.marius.blog=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
