services:
  - type: web
    name: music-movies-blog-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-movies-blog-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_JPA_FORMAT_SQL
        value: "false"
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: music-movies-blog-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://music-movies-blog-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: music-movies-blog-db
    region: frankfurt
    plan: free
    databaseName: music_movies_blog
    user: music_movies_blog_user
